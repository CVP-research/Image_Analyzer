<!DOCTYPE html>
<html>
<head>
    <title>객체 선택 및 저장</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        #canvas-container { position: relative; display: inline-block; }
        #mask-canvas { position: absolute; top: 0; left: 0; cursor: pointer; }
        #main-image { display: block; max-width: 90vw; max-height: 80vh; }
        #status { margin-top: 10px; font-weight: bold; min-height: 1.2em; }
        .nav-container { margin: 1em 0; display: flex; justify-content: space-between; align-items: center; max-width: 90vw; }
        .nav-btn { padding: 10px 20px; text-decoration: none; background-color: #007bff; color: white; border-radius: 5px; }
        .nav-btn.disabled { background-color: #ccc; cursor: not-allowed; }
        .complete-btn { padding: 10px 20px; background-color: #28a745; color: white; border-radius: 5px; border: none; cursor: pointer; font-size: 1em; }
        .complete-btn:hover { background-color: #218838; }
        .status-saving { color: #007bff; }
        .status-success { color: #28a745; }
        .status-error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="nav-container">
        <a href="{{ '/select/' ~ prev_id if prev_id is not none else '#' }}" 
           class="nav-btn {{ 'disabled' if prev_id is none }}">
           &larr; 이전
        </a>
        <h2>프레임 {{ current_frame_num }} / {{ total_frames }} ({{ frame_name }})</h2>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="complete-btn" onclick="completeAndShutdown()">✅ 작업 완료</button>
            <a href="{{ '/select/' ~ next_id if next_id is not none else '#' }}" 
               class="nav-btn {{ 'disabled' if next_id is none }}">
               다음 &rarr;
            </a>
        </div>
    </div>
    
    <div id="status">마우스를 객체 위에 올리면 하이라이트됩니다. 클릭하여 서버에 저장하세요.</div>

    <div id="canvas-container">
        <img id="main-image" src="{{ image_url }}" alt="원본 이미지">
        <canvas id="mask-canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mask-canvas');
        const img = document.getElementById('main-image');
        const ctx = canvas.getContext('2d');
        const maskData = JSON.parse('{{ mask_data_json | safe }}'); 
        const frameId = {{ frame_id }};
        const statusDiv = document.getElementById('status');
        
        let naturalWidth = 0, naturalHeight = 0;
        
        async function completeAndShutdown() {
            if (confirm('세그멘테이션 작업을 완료하고 다음 단계로 진행하시겠습니까?')) {
                statusDiv.textContent = '작업 완료 중... 서버를 종료합니다.';
                statusDiv.className = 'status-saving';
                try {
                    await fetch('/api/complete', { method: 'POST' });
                } catch (e) {
                    // 서버가 종료되면서 연결이 끊어지므로 에러 무시
                }
                document.body.innerHTML = '<h1 style="text-align:center; margin-top:20vh;">✅ 세그멘테이션 완료! 브라우저를 닫아도 됩니다.</h1>';
            }
        }
        
        img.onload = function() {
            naturalWidth = img.naturalWidth;
            naturalHeight = img.naturalHeight;
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            drawMasks();
        };
        if (img.complete) img.onload();

        function drawMasks(hoverIndex = -1) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const scaleX = canvas.width / naturalWidth;
            const scaleY = canvas.height / naturalHeight;

            maskData.forEach((mask, index) => {
                ctx.beginPath();
                mask.points.forEach((point, i) => {
                    const x = point[0] * scaleX, y = point[1] * scaleY;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.closePath();
                
                if (index === hoverIndex) {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                    ctx.strokeStyle = '#FFFF00';
                    ctx.lineWidth = 3;
                } else {
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.4)';
                    ctx.strokeStyle = '#00FF00';
                    ctx.lineWidth = 2;
                }
                ctx.fill();
                ctx.stroke();
            });
        }
        
        function getMaskIndexAtPoint(x, y) {
            const scaleX = canvas.width / naturalWidth;
            const scaleY = canvas.height / naturalHeight;
            
            // Iterate from the last mask to the first (top to bottom in draw order)
            for (let i = maskData.length - 1; i >= 0; i--) {
                const mask = maskData[i];
                
                // Create the path for hit detection
                ctx.beginPath();
                mask.points.forEach((point, j) => {
                    const px = point[0] * scaleX;
                    const py = point[1] * scaleY;
                    if (j === 0) {
                        ctx.moveTo(px, py);
                    } else {
                        ctx.lineTo(px, py);
                    }
                });
                ctx.closePath();

                // If the point is in the path, we've found our top-most mask.
                if (ctx.isPointInPath(x, y)) {
                    return i; // Return the index and stop.
                }
            }
            
            return -1; // No mask found at this point
        }

        async function saveMask(maskIndex) {
            statusDiv.textContent = `객체 #${maskIndex} 저장 중...`;
            statusDiv.className = 'status-saving';
            
            try {
                const response = await fetch(`/save/${frameId}/${maskIndex}`, { method: 'POST' });
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    statusDiv.textContent = `✅ 객체 #${maskIndex} 저장 완료: ${result.path}`;
                    statusDiv.className = 'status-success';
                } else {
                    throw new Error(result.message || '서버 응답 오류');
                }
            } catch (error) {
                statusDiv.textContent = `❌ 저장 실패 (객체 #${maskIndex}): ${error.message}`;
                statusDiv.className = 'status-error';
            }
        }

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const hoveredIndex = getMaskIndexAtPoint(x, y);
            if (hoveredIndex !== -1) drawMasks(hoveredIndex);
        });
        
        canvas.addEventListener('click', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const selectedIndex = getMaskIndexAtPoint(x, y);
            if (selectedIndex !== -1) saveMask(selectedIndex);
        });

        window.addEventListener('resize', () => {
             canvas.width = img.clientWidth;
             canvas.height = img.clientHeight;
             drawMasks();
        });
    </script>
</body>
</html>
