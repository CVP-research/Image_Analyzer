<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Object - {{ frame_name }}</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background-color: #f0f0f0; }
        .header { width: 100%; background-color: #333; color: white; padding: 10px 0; text-align: center; margin-bottom: 20px; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .canvas-container { position: relative; border: 1px solid #ccc; background-color: white; }
        #imageCanvas { display: block; }
        .mask-info { margin-top: 10px; font-size: 0.9em; color: #555; }
        .mask-info span { font-weight: bold; }
        .navigation { margin-top: 20px; display: flex; gap: 10px; }
        .navigation button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .navigation button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .navigation button:hover:not(:disabled) { background-color: #0056b3; }
        .save-message { margin-top: 10px; color: green; font-weight: bold; }
        .error-message { margin-top: 10px; color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Select Object for Dataset Creation</h1>
        <p>{{ frame_name }} ({{ current_frame_num }} / {{ total_frames }})</p>
    </div>

    <div class="controls">
        <button onclick="zoomIn()">Zoom In</button>
        <button onclick="zoomOut()">Zoom Out</button>
        <button onclick="resetZoom()">Reset Zoom</button>
    </div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
    </div>

    <div class="mask-info">
        Hover over a mask to view details. Click to save.
        Currently hovering: <span id="hoverInfo">None</span>
    </div>
    <div id="saveMessage" class="save-message"></div>
    <div id="errorMessage" class="error-message"></div>

    <div class="navigation">
        <button onclick="location.href='/select/{{ prev_id }}'" {% if prev_id is none %}disabled{% endif %}>Previous Frame</button>
        <button onclick="location.href='/select/{{ next_id }}'" {% if next_id is none %}disabled{% endif %}>Next Frame</button>
    </div>

    <script>
        const imageCanvas = document.getElementById('imageCanvas');
        const ctx = imageCanvas.getContext('2d', { willReadFrequently: true });
        const maskData = {{ mask_data_json | tojson }};
        const frameId = {{ frame_id }};
        const imageUrl = "{{ image_url }}";
        const hoverInfo = document.getElementById('hoverInfo');
        const saveMessage = document.getElementById('saveMessage');
        const errorMessage = document.getElementById('errorMessage');

        let originalImage = new Image();
        let currentImage = new Image();
        let currentScale = 1;
        let masks = []; // To store mask data with bounding boxes for interaction
        let hoveredMaskIndex = -1;

        originalImage.onload = () => {
            imageCanvas.width = originalImage.width;
            imageCanvas.height = originalImage.height;
            currentImage = originalImage; // Start with original size
            drawCanvas();
            precomputeMaskInfo();
        };
        originalImage.src = imageUrl;

        function drawCanvas() {
            ctx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
            ctx.drawImage(currentImage, 0, 0, imageCanvas.width, imageCanvas.height);

            masks.forEach((mask, index) => {
                const isHovered = index === hoveredMaskIndex;
                const fillColor = isHovered ? 'rgba(0, 255, 0, 0.4)' : 'rgba(255, 0, 0, 0.3)';
                const strokeColor = isHovered ? 'lime' : 'red';

                if (mask.points.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(mask.points[0][0] * currentScale, mask.points[0][1] * currentScale);
                    for (let i = 1; i < mask.points.length; i++) {
                        ctx.lineTo(mask.points[i][0] * currentScale, mask.points[i][1] * currentScale);
                    }
                    ctx.closePath();
                    ctx.fillStyle = fillColor;
                    ctx.fill();
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });
        }

        function precomputeMaskInfo() {
            masks = maskData.map(mask => {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                if (mask.points.length > 0) {
                    mask.points.forEach(p => {
                        minX = Math.min(minX, p[0]);
                        minY = Math.min(minY, p[1]);
                        maxX = Math.max(maxX, p[0]);
                        maxY = Math.max(maxY, p[1]);
                    });
                }
                return { ...mask, bbox: { minX, minY, maxX, maxY } };
            });
        }

        imageCanvas.onmousemove = (event) => {
            const rect = imageCanvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) / currentScale;
            const y = (event.clientY - rect.top) / currentScale;

            let newHoveredMaskIndex = -1;
            for (let i = masks.length - 1; i >= 0; i--) { // Iterate backwards to pick top-most mask
                const mask = masks[i];
                if (ctx.isPointInPath(createPathFromPoints(mask.points), x, y)) {
                    newHoveredMaskIndex = i;
                    break;
                }
            }

            if (newHoveredMaskIndex !== hoveredMaskIndex) {
                hoveredMaskIndex = newHoveredMaskIndex;
                updateHoverInfo();
                drawCanvas();
            }
        };

        imageCanvas.onmouseout = () => {
            if (hoveredMaskIndex !== -1) {
                hoveredMaskIndex = -1;
                updateHoverInfo();
                drawCanvas();
            }
        };

        imageCanvas.onclick = () => {
            if (hoveredMaskIndex !== -1) {
                const maskToSave = masks[hoveredMaskIndex];
                saveMask(maskToSave.index);
            }
        };

        function createPathFromPoints(points) {
            const path = new Path2D();
            if (points.length > 0) {
                path.moveTo(points[0][0], points[0][1]);
                for (let i = 1; i < points.length; i++) {
                    path.lineTo(points[i][0], points[i][1]);
                }
                path.closePath();
            }
            return path;
        }

        function updateHoverInfo() {
            if (hoveredMaskIndex !== -1) {
                hoverInfo.textContent = `Mask ${masks[hoveredMaskIndex].index}`;
            } else {
                hoverInfo.textContent = 'None';
            }
        }

        async function saveMask(maskIndex) {
            saveMessage.textContent = 'Saving mask...';
            errorMessage.textContent = '';
            try {
                const response = await fetch(`/save/${frameId}/${maskIndex}`, { method: 'POST' });
                const data = await response.json();
                if (data.status === 'success') {
                    saveMessage.textContent = `Mask ${maskIndex} saved to ${data.path}`;
                } else {
                    errorMessage.textContent = `Failed to save mask: ${data.message}`;
                }
            } catch (error) {
                errorMessage.textContent = `Error saving mask: ${error.message}`;
            }
        }
        
        function zoomIn() {
            if (currentScale < 3) {
                currentScale += 0.2;
                resizeCanvas();
                drawCanvas();
            }
        }

        function zoomOut() {
            if (currentScale > 0.5) {
                currentScale -= 0.2;
                resizeCanvas();
                drawCanvas();
            }
        }

        function resetZoom() {
            currentScale = 1;
            resizeCanvas();
            drawCanvas();
        }

        function resizeCanvas() {
            imageCanvas.style.width = (originalImage.width * currentScale) + 'px';
            imageCanvas.style.height = (originalImage.height * currentScale) + 'px';
        }

    </script>
</body>
</html>
